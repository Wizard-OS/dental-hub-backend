services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${SECURITY_TEST_DB:?required}
      POSTGRES_PASSWORD: ${SECURITY_TEST_PASSWORD:?required}
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U postgres -d "$${POSTGRES_DB}"',
        ]
      interval: 1s
      timeout: 3s
      retries: 30
